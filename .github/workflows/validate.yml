name: Validate Home Service

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/AI_CONTEXT.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/AI_CONTEXT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, occurrence register and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate occurrence register
        run: npm run check:occurrences

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
