name: AI Context — Synchronize

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/AI_CONTEXT.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh repository context
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update generated context snapshot
        env:
          AI_CONTEXT_COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/update-ai-context.mjs

      - name: Commit and push generated changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- docs/AI_CONTEXT.md; then
            echo "The AI context snapshot is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI_CONTEXT.md
          git commit -m "docs(ai-context): atualizar snapshot automaticamente"
          git push origin "HEAD:${BRANCH_NAME}"
